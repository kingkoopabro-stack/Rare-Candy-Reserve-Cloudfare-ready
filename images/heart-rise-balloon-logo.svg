<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 132" role="img" aria-label="Heart Rise — heart-shaped hot-air balloon">
  <defs>
    <linearGradient id="hrBalloonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="45%" stop-color="#ff9a00"/>
      <stop offset="75%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <!-- Envelope: a heart, the balloon itself -->
  <path d="M50 84 C26 64 14 50 14 33 C14 20 23 8 33 8 C41 8 47 13 50 20 C53 13 59 8 67 8 C77 8 86 20 86 33 C86 50 74 64 50 84 Z" fill="url(#hrBalloonGrad)" stroke="#5b2a86" stroke-width="2" stroke-linejoin="round"/>
  <!-- Patchwork seams (echoes the patchwork balloon, kept subtle so it reads small) -->
  <path d="M50 20 C50 40 50 62 50 82" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <path d="M30 11 C24 28 26 52 42 76" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
  <path d="M70 11 C76 28 74 52 58 76" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
  <!-- Shine -->
  <path d="M24 26 C24 18 30 13 36 12" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ropes -->
  <path d="M30 70 L43 104 M70 70 L57 104 M50 84 L50 104" fill="none" stroke="#4a3220" stroke-width="2" stroke-linecap="round"/>
  <!-- Basket -->
  <rect x="42" y="104" width="16" height="13" rx="2.5" fill="#7a4a21" stroke="#4a2a10" stroke-width="1"/>
  <path d="M42 108.5 H58 M42 113 H58" stroke="#a97c4f" stroke-width="1"/>
</svg>
